<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<script src="jquery.min.js"></script>
<title>Garzon's</title>
<style type="text/css">
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000; /* Set background to black */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#background-canvas {
    position: fixed; /* Stays in place */
    top: 0;
    left: 0;
    z-index: -2; /* Behind everything */
}

#trace-canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: -1;
}

/* Control Panel */
#control-panel {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: rgba(20, 20, 20, 0.8);
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
}

#control-panel fieldset {
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    padding: 10px;
    margin-bottom: 10px;
}

#control-panel legend {
    padding: 0 5px;
    color: #00aaff;
}

#control-panel .control-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

#control-panel label {
    margin-right: 10px;
}

#control-panel a, #control-panel select {
    color: #fff;
    background-color: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 5px 8px;
    border-radius: 4px;
    text-decoration: none;
    transition: background-color 0.3s ease;
}

#control-panel a:hover, #control-panel select:hover {
    background-color: rgba(0, 170, 255, 0.5);
}

#control-panel select {
    width: 120px;
}

/* Planet Visuals */
.celestial-body-container {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Center the container on the calculated position */
    transform: translate(-50%, -50%);
}

.celestial-body {
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    transition: transform 0.2s ease-in-out;
}

.sun-glow {
     box-shadow: 0 0 30px #ffcc00, 0 0 60px #ff8800;
}

.planet-name {
    color: #fff;
    font-size: 12px;
    text-align: center;
    margin-top: 5px;
    opacity: 0.7; /* Always visible */
    transition: all 0.3s ease;
    text-shadow: 0 0 5px #000;
}

.celestial-body-container:hover .planet-name {
    opacity: 1;
    transform: scale(1.2);
}
.celestial-body-container:hover .celestial-body {
    transform: scale(1.2);
}


/* Info Panel */
#info-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 250px;
    background-color: rgba(20, 20, 20, 0.8);
    color: #fff;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    opacity: 0; /* Hidden for transition */
    transition: opacity 0.5s ease-in-out;
    pointer-events: none; /* Prevent interaction when hidden */
}

#info-panel.visible {
    opacity: 1;
    pointer-events: auto;
}

#info-panel h3 {
    margin-top: 0;
    font-size: 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    padding-bottom: 10px;
    color: #00aaff;
}

#info-panel p {
    margin: 10px 0;
    font-size: 14px;
}

</style>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <canvas id="trace-canvas"></canvas>
    <canvas id="planet-canvas"></canvas>

    <div id="control-panel">
        <fieldset>
            <legend>View</legend>
            <div class="control-group">
                <label for="zoom-in">Zoom</label>
                <div>
                    <a id="zoom-in" href="#">+</a>
                    <a id="zoom-out" href="#">-</a>
                </div>
            </div>
            <div class="control-group">
                <label for="focus-select">Focus</label>
                <select id="focus-select">
                    <option value="-1">None</option>
                </select>
            </div>
             <div class="control-group">
                <label>Trace</label>
                <div>
                    <a id="toggle-trace" href="#">Hide</a>
                    <a id="clear-trace" href="#">Clear</a>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>Simulation</legend>
            <div class="control-group">
                    <label for="speed-up">Speed</label>
                     <div>
                        <a id="speed-up" href="#">&gt;</a>
                        <a id="speed-down" href="#">&lt;</a>
                    </div>
                </div>
                <div class="control-group">
                    <label for="pause-button">State</label>
                    <a id="pause-button" href="#">Pause</a>
                </div>
        </fieldset>
    </div>

    <div id="info-panel">
        <h3 id="info-planet-name"></h3>
        <p><strong>Distance from Sun:</strong> <span id="info-distance"></span></p>
        <p><strong>Velocity:</strong> <span id="info-velocity"></span></p>
    </div>

</body>

<script src="model.js"></script>

</html>
